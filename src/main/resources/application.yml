  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always

spring:
  datasource:
    url: jdbc:mysql://172.20.0.2:3306/workflow_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 8NOG8HweNIY4kg0mWBqx
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
